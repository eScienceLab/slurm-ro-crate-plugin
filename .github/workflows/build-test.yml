name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "8888:3306"
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: koesterlab/setup-slurm-action@v1

      - name: Install build + validator tooling
        run: |
          sudo apt-get install -y libslurm-dev cmake build-essential
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Install plugin
        run: sudo cmake --install build

      - name: Register plugin in plugstack.conf
        run: |
          echo "required /usr/local/lib/slurm/slurm-ro-crate-plugin.so output_dir=/tmp/spank-crates" | sudo tee -a /etc/slurm/plugstack.conf

      - name: Run integration tests
        run: ctest --test-dir build --output-on-failure
